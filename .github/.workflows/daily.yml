name: Fight Calendar

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 7 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAYS_AHEAD: "30"
        run: |
          python src/main.py

      - name: Save database
        run: |
          git config user.name "fight-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sent.json

          git diff --cached --quiet || git commit -m "Update sent events"

          git push
